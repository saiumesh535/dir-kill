[package]
name = "dir-kill"
version = "0.8.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2.174"
chrono = "0.4"
regex = { version = "1.11.1", default-features = false, features = ["std"] }
filesize = "0.2.0"
jwalk = "0.8.1"
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
getattrlistbulk = "0.1"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
